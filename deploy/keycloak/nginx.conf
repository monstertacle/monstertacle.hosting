events {}
http {
    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    # Match the original request URI, before upstream canonicalization.
    map $request_uri $login_allowed {
        default 0;
        "~^/realms/hosting/protocol/openid-connect/(?:auth|token|certs|logout)(?:\?|$)" 1;
        "~^/realms/hosting/login-actions/(?:authenticate|required-action|restart|action-token|reset-credentials)(?:\?|$)" 1;
        "~^/resources/(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*(?:\?|$)" 1;
    }

    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_set_header Accept-Encoding "";

    server {
        listen 9443 ssl;
        location ~ ^/(?:\.well-known/oauth-authorization-server/realms/hosting|realms/hosting/\.well-known/openid-configuration)$ {
            if ($request_uri !~ "^/(?:\.well-known/oauth-authorization-server/realms/hosting|realms/hosting/\.well-known/openid-configuration)(?:\?|$)") { return 404; }
            limit_except GET { deny all; }
            sub_filter_types application/json;
            sub_filter ',"registration_endpoint":"${KEYCLOAK_PUBLIC_ORIGIN}/realms/hosting/clients-registrations/openid-connect"' '';
            sub_filter '"token_endpoint_auth_methods_supported":[' '"token_endpoint_auth_methods_supported":["none",';
            proxy_pass http://keycloak:8080;
        }
        location / {
            if ($login_allowed = 0) { return 404; }
            proxy_pass http://keycloak:8080;
        }
    }

    server {
        listen 9444 ssl;
        location / {
            proxy_pass http://keycloak:8080;
        }
    }
}
