name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Pack and restore the pinned local tool
        shell: pwsh
        run: ./tests/verify-tool-package.ps1

  linux-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: bash deploy/smoke.sh

  linux-quadlet:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Verify public ingress unit examples
        run: |
          bash -n deploy/public-ingress/preflight.sh
          systemd-analyze verify deploy/public-ingress/hosting-public-edge.{socket,service}
      - name: Run rootless Quadlet smoke
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          bash deploy/smoke.sh --quadlet
